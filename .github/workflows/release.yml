name: Create Release

on:
  push:
    tags:
      - 'v*'  # triggers on any tag starting with 'v'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract release notes
        id: extract_notes
        run: |
            TAG="${GITHUB_REF_NAME#v}"   # remove leading 'v' if your tag is 'v1.0.0'
            NOTES=$(awk -v tag="$TAG" '
                /^## \[.*\]/ {in_section=0}               # Reset at every header
                $0 ~ "^## \\[" tag "\\]" {in_section=1; next}  # Start when we find the tag
                in_section {print}
            ' CHANGELOG.md)
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "TAG=$TAG"
            echo "EXTRACTED NOTES:"
            echo "$NOTES"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}      # tag that was pushed
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
