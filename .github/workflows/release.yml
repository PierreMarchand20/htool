name: Create Release

on:
  push:
    tags:
      - 'v*'  # triggers on any tag starting with 'v'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (use for manual dispatch)"
        required: false

permissions:
  contents: write   # required for gh release create

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set release tag
        id: set_tag
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            # Tag push: extract from GITHUB_REF
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' for matching changelog
          TAG="${RAW_TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "raw_tag=$RAW_TAG" >> $GITHUB_OUTPUT

      - name: Checkout tag commit
        run: |
          git fetch --tags
          git checkout "${{ steps.set_tag.outputs.raw_tag }}"

      - name: Extract release notes
        id: extract_notes
        run: |
            TAG="${{ steps.set_tag.outputs.tag }}"
            awk -v tag="$TAG" '
                /^## \[.*\]/ {in_section=0}               # Reset at every header
                $0 ~ "^## \\[" tag "\\]" {in_section=1; next}  # Start when we find the tag
                in_section {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
            
            # Just in case, trim trailing empty lines
            sed -i '/^[[:space:]]*$/d' RELEASE_NOTES.md

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.set_tag.outputs.raw_tag }}" \
            --title "Release ${{ steps.set_tag.outputs.raw_tag }}" \
            --notes-file RELEASE_NOTES.md \
            --target "${{ steps.set_tag.outputs.raw_tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
